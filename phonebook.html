<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>모임별 회원 전화번호부</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 8px;
    color: #334155;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.05);
}

.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   메인 제목
========================= */

.main-header {
    text-align: center;
    padding: 12px 0 22px;
}

.main-title {
    margin: 0;
    font-size: 24px;
    color: #243447;
}

.main-subtitle {
    margin: 14px 0 0;
    font-size: 14px;
    color: #7b8794;
}


/* =========================
   모임 카드
========================= */

.group-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.025);
}

.group-main {
    display: flex;
    align-items: center;
    width: 100%;
}

.group-open {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;

    border: none;
    background: transparent;

    padding: 16px 10px 16px 14px;

    text-align: left;
    cursor: pointer;
    font-family: inherit;
}

.group-open:active {
    background: #f8fafc;
}

.group-info {
    min-width: 0;
}

.group-name {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #2563eb;
    font-size: 17px;
    font-weight: 700;
}


/* =========================
   작은 색상 사람 아이콘
========================= */

.group-icon {
    width: 25px;
    height: 25px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 12px;
    line-height: 1;

    flex-shrink: 0;
}

/* 파랑 */
.icon-1 {
    background: #e6f0ff;
}

/* 보라 */
.icon-2 {
    background: #f0e9ff;
}

/* 초록 */
.icon-3 {
    background: #e6f7ee;
}

/* 분홍 */
.icon-4 {
    background: #ffeaf2;
}

/* 주황 */
.icon-5 {
    background: #fff1df;
}


.group-desc {
    margin-top: 6px;
    margin-left: 33px;

    color: #718096;
    font-size: 13px;
}

.group-action {
    color: #2563eb;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    margin-left: 8px;
}


/* =========================
   점 3개 관리 메뉴
========================= */

.menu-btn {
    width: 40px;
    height: 40px;

    margin-right: 7px;

    border: none;
    border-radius: 50%;

    background: transparent;

    font-size: 22px;
    color: #64748b;

    cursor: pointer;
}

.menu-btn:active {
    background: #eef2f7;
}

.group-menu {
    display: none;

    position: absolute;

    right: 10px;
    top: 58px;

    width: 165px;

    background: #ffffff;

    border: 1px solid #dce3ea;
    border-radius: 11px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.15);

    z-index: 100;

    overflow: hidden;
}

.group-menu.show {
    display: block;
}

.group-menu button {
    display: block;

    width: 100%;

    padding: 12px 14px;

    border: none;
    border-bottom: 1px solid #edf0f3;

    background: #ffffff;

    text-align: left;

    font-size: 13px;

    cursor: pointer;
}

.group-menu button:last-child {
    border-bottom: none;
}

.group-menu button:active {
    background: #f1f5f9;
}

.group-menu .delete-menu {
    color: #dc2626;
}


/* =========================
   순서 변경
========================= */

.reorder-panel {
    display: none;
    align-items: center;
    gap: 5px;
    padding-right: 9px;
}

.reorder-mode .group-action,
.reorder-mode .menu-btn {
    display: none;
}

.reorder-mode .reorder-panel {
    display: flex;
}

.move-btn {
    width: 35px;
    height: 35px;

    border: 1px solid #d8dee7;
    border-radius: 8px;

    background: #f8fafc;
    color: #475569;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.move-btn:active {
    background: #e2e8f0;
}

.move-btn:disabled {
    opacity: 0.25;
    cursor: default;
}

.reorder-help {
    display: none;

    text-align: center;

    margin-bottom: 12px;
    padding: 9px;

    background: #f5f3ff;

    border-radius: 9px;

    color: #6d28d9;

    font-size: 12px;
}

.reorder-help.show {
    display: block;
}


/* =========================
   하단 버튼
========================= */

.bottom-tools {
    margin-top: 18px;
}

.add-group-btn {
    width: 100%;

    padding: 14px;

    border: none;
    border-radius: 11px;

    background: #7c3aed;
    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.reorder-btn {
    width: 100%;

    margin-top: 10px;
    padding: 12px;

    border: 1px solid #d7dee8;
    border-radius: 10px;

    background: #f8fafc;
    color: #475569;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.reorder-btn.active {
    background: #16a34a;
    border-color: #16a34a;
    color: #ffffff;
}

.backup-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.backup-btn {
    flex: 1;

    padding: 11px;

    border: 1px solid #d7dee8;
    border-radius: 9px;

    background: #f8fafc;
    color: #475569;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
}


/* =========================
   상세 화면
========================= */

.detail-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    border: none;
    border-radius: 8px;

    padding: 9px 13px;

    background: #64748b;
    color: #ffffff;

    font-size: 13px;

    cursor: pointer;
}

.save-text {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
}

.detail-title {
    margin: 22px 0 18px;

    text-align: center;

    color: #243447;
    font-size: 21px;
}


/* =========================
   검색
========================= */

.search-box {
    position: relative;
    margin-bottom: 10px;
}

.search-input {
    width: 100%;

    padding: 12px 42px 12px 40px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #f8fafc;

    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #2563eb;
    background: #ffffff;
}

.search-icon {
    position: absolute;

    left: 13px;
    top: 50%;

    transform: translateY(-50%);
}

.clear-search {
    display: none;

    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 27px;
    height: 27px;

    border: none;
    border-radius: 50%;

    background: #e2e8f0;
    color: #475569;

    cursor: pointer;
}

.search-result {
    margin: 0 0 10px 3px;

    color: #64748b;
    font-size: 12px;
}


/* =========================
   회원 카드
========================= */

.member-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.member-card {
    padding: 11px;

    border: 1px solid #dbe2ea;
    border-radius: 12px;

    background: #ffffff;

    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.member-top {
    display: grid;

    grid-template-columns: 1fr 1.5fr;

    gap: 7px;
}

.member-card input {
    width: 100%;

    padding: 10px;

    border: 1px solid #d7dee8;
    border-radius: 7px;

    font-size: 14px;
    outline: none;
}

.member-card input:focus {
    border-color: #2563eb;
    background: #f8fbff;
}

.memo-input {
    margin-top: 7px;
}

.member-actions {
    display: flex;
    gap: 6px;

    margin-top: 9px;
}

.action-btn {
    flex: 1;

    border: none;
    border-radius: 7px;

    padding: 10px 4px;

    color: #ffffff;

    font-size: 13px;

    cursor: pointer;
}

.call-btn {
    background: #2563eb;
}

.sms-btn {
    background: #0891b2;
}

.delete-btn {
    background: #dc2626;
}

.add-member-btn {
    width: 100%;

    margin-top: 13px;
    padding: 13px;

    border: none;
    border-radius: 9px;

    background: #16a34a;
    color: #ffffff;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.empty-message {
    padding: 25px 10px;

    text-align: center;

    color: #94a3b8;

    font-size: 14px;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 12px;
    }

    .main-title {
        font-size: 22px;
    }

    .group-name {
        font-size: 17px;
    }

    .group-icon {
        width: 24px;
        height: 24px;
        font-size: 11px;
    }

    .group-desc {
        margin-left: 32px;
    }

    .member-top {
        grid-template-columns: 1fr;
    }

    .action-btn {
        font-size: 12px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- 메인 -->

    <div id="page-main" class="page active">

        <div class="main-header">

            <h1 class="main-title">
                📚 모임별 전화번호부
            </h1>

            <p class="main-subtitle">
                확인하고 싶은 모임을 누르세요.
            </p>

        </div>


        <div
            id="reorder-help"
            class="reorder-help"
        >
            ▲ ▼ 버튼을 눌러 원하는 순서로 이동하세요.
        </div>


        <div id="group-list"></div>


        <div class="bottom-tools">

            <button
                type="button"
                class="add-group-btn"
                onclick="addGroup()"
            >
                ＋ 새로운 모임 추가
            </button>


            <button
                type="button"
                id="reorder-btn"
                class="reorder-btn"
                onclick="toggleReorderMode()"
            >
                ↕ 모임 순서 변경
            </button>


            <div class="backup-row">

                <button
                    type="button"
                    class="backup-btn"
                    onclick="backupData()"
                >
                    📥 백업하기
                </button>

                <button
                    type="button"
                    class="backup-btn"
                    onclick="document.getElementById('restore-file').click()"
                >
                    📤 복원하기
                </button>

            </div>


            <input
                type="file"
                id="restore-file"
                accept=".json,application/json"
                style="display:none"
                onchange="restoreData(event)"
            >

        </div>

    </div>



    <!-- 회원 상세 -->

    <div id="page-detail" class="page">

        <div class="detail-top">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >
                ← 모임 목록
            </button>

            <span class="save-text">
                ✓ 자동 저장
            </span>

        </div>


        <h1
            id="group-title"
            class="detail-title"
        >
            회원 명단
        </h1>


        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="이름, 전화번호, 메모 검색"
                oninput="searchMembers()"
            >

            <button
                type="button"
                id="clear-search"
                class="clear-search"
                onclick="clearSearch()"
            >
                ×
            </button>

        </div>


        <div
            id="search-result"
            class="search-result"
        ></div>


        <div
            id="member-list"
            class="member-list"
        ></div>


        <button
            type="button"
            class="add-member-btn"
            onclick="addMember()"
        >
            ＋ 회원 추가
        </button>

    </div>

</div>



<script>

/* =========================
   저장 설정
========================= */

const STORAGE_KEY =
    'phoneBookDataV3';


const defaultData = {

    '독서모임': {
        icon: '👥',
        desc: '매월 첫주 도서 토론',
        members: [
            {
                name: '김철수',
                phone: '010-1234-5678',
                memo: '총무'
            },
            {
                name: '이영희',
                phone: '010-9876-5432',
                memo: '회원'
            }
        ]
    },

    '동창회': {
        icon: '👥',
        desc: '연 2회 정기 모임',
        members: [
            {
                name: '박민수',
                phone: '010-5555-4444',
                memo: '회장'
            }
        ]
    },

    '등산모임': {
        icon: '👥',
        desc: '주말 산행 및 건강 관리',
        members: []
    }

};


function copyData(data) {

    return JSON.parse(
        JSON.stringify(data)
    );

}


function loadSavedData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved !== null) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                typeof parsed === 'object' &&
                !Array.isArray(parsed)
            ) {

                return parsed;

            }

        } catch (error) {

            console.log(
                '저장 데이터 오류'
            );

        }

    }


    const fresh =
        copyData(defaultData);


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(fresh)
    );


    return fresh;

}


let groupData =
    loadSavedData();


let currentGroup =
    '';


let currentSearch =
    '';


let reorderMode =
    false;


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(groupData)
    );

}


/* =========================
   모임 목록
========================= */

function loadGroupList() {

    const list =
        document.getElementById(
            'group-list'
        );


    list.innerHTML =
        '';


    const names =
        Object.keys(groupData);


    if (
        names.length === 0
    ) {

        list.innerHTML = `
            <div class="empty-message">
                등록된 모임이 없습니다.<br><br>
                아래에서 새로운 모임을 추가해주세요.
            </div>
        `;

        return;

    }


    names.forEach(
        (groupName, index) => {


            const group =
                groupData[groupName];


            if (
                !Array.isArray(
                    group.members
                )
            ) {

                group.members = [];

            }


            const memberCount =
                group.members.length;


            const iconClass =
                'icon-' +
                ((index % 5) + 1);


            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'group-card';


            if (reorderMode) {

                card.classList.add(
                    'reorder-mode'
                );

            }


            card.innerHTML = `

                <div class="group-main">

                    <button
                        type="button"
                        class="group-open"
                    >

                        <div class="group-info">

                            <div class="group-name">

                                <span class="group-icon ${iconClass}">
                                    👥
                                </span>

                                <span>
                                    ${escapeHtml(groupName)}
                                </span>

                            </div>


                            <div class="group-desc">

                                ${escapeHtml(
                                    group.desc || '회원 모임'
                                )}

                                · 회원 ${memberCount}명

                            </div>

                        </div>


                        <div class="group-action">
                            열기 →
                        </div>

                    </button>


                    <button
                        type="button"
                        class="menu-btn"
                        aria-label="모임 관리"
                    >
                        ⋮
                    </button>


                    <div class="reorder-panel">

                        <button
                            type="button"
                            class="move-btn move-up"
                            ${index === 0 ? 'disabled' : ''}
                        >
                            ▲
                        </button>

                        <button
                            type="button"
                            class="move-btn move-down"
                            ${index === names.length - 1 ? 'disabled' : ''}
                        >
                            ▼
                        </button>

                    </div>

                </div>


                <div class="group-menu">

                    <button
                        type="button"
                        class="rename-menu"
                    >
                        ✏️ 이름 변경
                    </button>

                    <button
                        type="button"
                        class="desc-menu"
                    >
                        📝 설명 변경
                    </button>

                    <button
                        type="button"
                        class="delete-menu"
                    >
                        🗑 모임 삭제
                    </button>

                </div>

            `;


            const openButton =
                card.querySelector(
                    '.group-open'
                );


            const menuButton =
                card.querySelector(
                    '.menu-btn'
                );


            const menu =
                card.querySelector(
                    '.group-menu'
                );


            openButton.onclick =
                function () {

                    if (reorderMode) {
                        return;
                    }

                    closeAllMenus();

                    openGroup(
                        groupName
                    );

                };


            menuButton.onclick =
                function (event) {

                    event.stopPropagation();


                    if (reorderMode) {
                        return;
                    }


                    const isOpen =
                        menu.classList
                            .contains('show');


                    closeAllMenus();


                    if (!isOpen) {

                        menu.classList.add(
                            'show'
                        );

                    }

                };


            card.querySelector(
                '.rename-menu'
            ).onclick =
                function () {

                    closeAllMenus();

                    renameGroup(
                        groupName
                    );

                };


            card.querySelector(
                '.desc-menu'
            ).onclick =
                function () {

                    closeAllMenus();

                    editGroupDescription(
                        groupName
                    );

                };


            card.querySelector(
                '.delete-menu'
            ).onclick =
                function () {

                    closeAllMenus();

                    deleteGroup(
                        groupName
                    );

                };


            const upButton =
                card.querySelector(
                    '.move-up'
                );


            const downButton =
                card.querySelector(
                    '.move-down'
                );


            upButton.onclick =
                function () {

                    moveGroup(
                        index,
                        -1
                    );

                };


            downButton.onclick =
                function () {

                    moveGroup(
                        index,
                        1
                    );

                };


            list.appendChild(
                card
            );

        }
    );

}


/* =========================
   순서 변경
========================= */

function toggleReorderMode() {

    reorderMode =
        !reorderMode;


    closeAllMenus();


    const button =
        document.getElementById(
            'reorder-btn'
        );


    const help =
        document.getElementById(
            'reorder-help'
        );


    if (reorderMode) {

        button.innerHTML =
            '✓ 순서 변경 완료';


        button.classList.add(
            'active'
        );


        help.classList.add(
            'show'
        );

    } else {

        button.innerHTML =
            '↕ 모임 순서 변경';


        button.classList.remove(
            'active'
        );


        help.classList.remove(
            'show'
        );

    }


    loadGroupList();

}


/* =========================
   위 아래 이동
========================= */

function moveGroup(
    currentIndex,
    direction
) {

    const names =
        Object.keys(groupData);


    const newIndex =
        currentIndex +
        direction;


    if (
        newIndex < 0 ||
        newIndex >= names.length
    ) {

        return;

    }


    const temp =
        names[currentIndex];


    names[currentIndex] =
        names[newIndex];


    names[newIndex] =
        temp;


    const newData =
        {};


    names.forEach(
        name => {

            newData[name] =
                groupData[name];

        }
    );


    groupData =
        newData;


    saveData();

    loadGroupList();

}


/* =========================
   메뉴 닫기
========================= */

function closeAllMenus() {

    document
        .querySelectorAll(
            '.group-menu'
        )
        .forEach(
            menu => {

                menu.classList.remove(
                    'show'
                );

            }
        );

}


document.addEventListener(
    'click',
    function (event) {

        if (
            !event.target.closest(
                '.group-card'
            )
        ) {

            closeAllMenus();

        }

    }
);


/* =========================
   모임 열기
========================= */

function openGroup(groupName) {

    if (!groupData[groupName]) {
        return;
    }


    currentGroup =
        groupName;


    currentSearch =
        '';


    document.getElementById(
        'search-input'
    ).value =
        '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    document.getElementById(
        'group-title'
    ).innerText =
        groupName +
        ' 회원 명단';


    document.getElementById(
        'page-main'
    ).classList.remove(
        'active'
    );


    document.getElementById(
        'page-detail'
    ).classList.add(
        'active'
    );


    loadMembers();


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


/* =========================
   목록으로
========================= */

function goBack() {

    document.getElementById(
        'page-detail'
    ).classList.remove(
        'active'
    );


    document.getElementById(
        'page-main'
    ).classList.add(
        'active'
    );


    currentGroup = '';
    currentSearch = '';


    loadGroupList();


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


/* =========================
   이름 변경
========================= */

function renameGroup(oldName) {

    const newName =
        prompt(
            '새로운 모임 이름을 입력해주세요.',
            oldName
        );


    if (newName === null) {
        return;
    }


    const cleanName =
        newName.trim();


    if (!cleanName) {

        alert(
            '모임 이름을 입력해주세요.'
        );

        return;
    }


    if (
        cleanName === oldName
    ) {
        return;
    }


    if (
        groupData[cleanName]
    ) {

        alert(
            '이미 같은 이름의 모임이 있습니다.'
        );

        return;
    }


    const newData =
        {};


    Object.keys(
        groupData
    ).forEach(
        name => {

            if (
                name === oldName
            ) {

                newData[cleanName] =
                    groupData[oldName];

            } else {

                newData[name] =
                    groupData[name];

            }

        }
    );


    groupData =
        newData;


    saveData();

    loadGroupList();

}


/* =========================
   설명 변경
========================= */

function editGroupDescription(
    groupName
) {

    const currentDescription =
        groupData[groupName]
            .desc || '';


    const newDescription =
        prompt(
            '모임 설명을 입력해주세요.',
            currentDescription
        );


    if (
        newDescription === null
    ) {
        return;
    }


    groupData[groupName].desc =
        newDescription.trim() ||
        '회원 모임';


    saveData();

    loadGroupList();

}


/* =========================
   모임 삭제
========================= */

function deleteGroup(
    groupName
) {

    const group =
        groupData[groupName];


    if (!group) {
        return;
    }


    const memberCount =
        group.members
        ? group.members.length
        : 0;


    if (
        !confirm(
            groupName +
            ' 모임과 회원 ' +
            memberCount +
            '명의 정보를 삭제하시겠습니까?'
        )
    ) {
        return;
    }


    if (
        !confirm(
            '정말 삭제하시겠습니까?'
        )
    ) {
        return;
    }


    delete groupData[groupName];


    saveData();

    loadGroupList();

}


/* =========================
   새 모임 추가
========================= */

function addGroup() {

    const name =
        prompt(
            '새로운 모임 이름을 입력해주세요.'
        );


    if (
        name === null
    ) {
        return;
    }


    const cleanName =
        name.trim();


    if (!cleanName) {

        alert(
            '모임 이름을 입력해주세요.'
        );

        return;
    }


    if (
        groupData[cleanName]
    ) {

        alert(
            '이미 같은 이름의 모임이 있습니다.'
        );

        return;
    }


    const desc =
        prompt(
            '모임 설명을 입력해주세요.'
        );

        desc:

            ? desc.trim()

        members:
            []

    };

}


/* =========================
   회원 목록
========================= */

function loadMembers() {

    const list =
        document.getElementById(
            'member-list'
        );


    const result =
        document.getElementById(
            'search-result'
        );


    list.innerHTML =
        '';


    if (
        !currentGroup ||
        !groupData[currentGroup]
    ) {
        return;
    }


    const members =
        groupData[currentGroup]
            .members;


    const keyword =
        currentSearch
            .trim()
            .toLowerCase();


    const filtered =
        [];


    members.forEach(
        (member, index) => {

            const text =
                (
                    (member.name || '') +
                    ' ' +
                    (member.phone || '') +
                    ' ' +
                    (member.memo || '')
                )
                .toLowerCase();


            if (
                !keyword ||
                text.includes(
                    keyword
                )
            ) {

                filtered.push({
                    member,
                    index
                });

            }

        }
    );


    result.innerText =
        keyword
        ? '검색 결과 ' +
          filtered.length +
          '명'
        : '전체 회원 ' +
          members.length +
          '명';


    if (
        filtered.length === 0
    ) {

        list.innerHTML =
            keyword
            ? `
                <div class="empty-message">
                    🔍 검색된 회원이 없습니다.
                </div>
              `
            : `
                <div class="empty-message">
                    등록된 회원이 없습니다.<br><br>
                    아래의 ＋ 회원 추가를 눌러주세요.
                </div>
              `;

        return;
    }


    filtered.forEach(
        item => {

            const member =
                item.member;


            const index =
                item.index;


            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'member-card';


            card.innerHTML = `

                <div class="member-top">

                    <input
                        type="text"
                        value="${escapeHtml(member.name || '')}"
                        placeholder="이름"
                        oninput="updateMember(${index}, 'name', this.value)"
                    >

                    <input
                        type="tel"
                        value="${escapeHtml(member.phone || '')}"
                        placeholder="010-0000-0000"
                        oninput="updateMember(${index}, 'phone', this.value)"
                    >

                </div>


                <input
                    type="text"
                    class="memo-input"
                    value="${escapeHtml(member.memo || '')}"
                    placeholder="메모"
                    oninput="updateMember(${index}, 'memo', this.value)"
                >


                <div class="member-actions">

                    <button
                        type="button"
                        class="action-btn call-btn"
                        onclick="callPhone(${index})"
                    >
                        📞 전화
                    </button>

                    <button
                        type="button"
                        class="action-btn sms-btn"
                        onclick="sendSMS(${index})"
                    >
                        💬 문자
                    </button>

                    <button
                        type="button"
                        class="action-btn delete-btn"
                        onclick="deleteMember(${index})"
                    >
                        🗑 삭제
                    </button>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* =========================
   검색
========================= */

function searchMembers() {

    const input =
        document.getElementById(
            'search-input'
        );


    currentSearch =
        input.value;


    document.getElementById(
        'clear-search'
    ).style.display =
        currentSearch.trim()
        ? 'block'
        : 'none';


    loadMembers();

}


function clearSearch() {

    const input =
        document.getElementById(
            'search-input'
        );


    input.value = '';

    currentSearch = '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    loadMembers();

    input.focus();

}


/* =========================
   회원 수정
========================= */

function updateMember(
    index,
    field,
    value
) {

    groupData[currentGroup]
        .members[index][field] =
        value;


    saveData();

}


/* =========================
   전화
========================= */

function callPhone(index) {

    const phone =
        groupData[currentGroup]
            .members[index]
            .phone || '';


    if (!phone) {

        alert(
            '전화번호를 먼저 입력해주세요.'
        );

        return;
    }


    const clean =
        phone.replace(
            /[^0-9+]/g,
            ''
        );


    window.location.href =
        'tel:' + clean;

}


/* =========================
   문자
========================= */

function sendSMS(index) {

    const phone =
        groupData[currentGroup]
            .members[index]
            .phone || '';


    if (!phone) {

        alert(
            '전화번호를 먼저 입력해주세요.'
        );

        return;
    }


    const clean =
        phone.replace(
            /[^0-9+]/g,
            ''
        );


    window.location.href =
        'sms:' + clean;

}


/* =========================
   회원 추가
========================= */

function addMember() {

    groupData[currentGroup]
        .members
        .push({

            name: '',
            phone: '',
            memo: ''

        });


    saveData();


    currentSearch = '';


    document.getElementById(
        'search-input'
    ).value = '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    loadMembers();

}


/* =========================
   회원 삭제
========================= */

function deleteMember(index) {

    const member =
        groupData[currentGroup]
            .members[index];


    let message =
        '이 회원을 삭제하시겠습니까?';


    if (member.name) {

        message =
            member.name +
            ' 회원을 삭제하시겠습니까?';

    }


    if (!confirm(message)) {
        return;
    }


    groupData[currentGroup]
        .members
        .splice(
            index,
            1
        );


    saveData();

    loadMembers();

}


/* =========================
   백업
========================= */

function backupData() {

    const backup = {

        app:
            '모임별 전화번호부',

        version:
            1,

        savedAt:
            new Date().toISOString(),

        data:
            groupData

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    'application/json'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            'a'
        );


    const today =
        new Date()
            .toISOString()
            .slice(0,10);


    link.href =
        url;


    link.download =
        '전화번호부_백업_' +
        today +
        '.json';


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/* =========================
   복원
========================= */

function restoreData(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function () {

            try {

                const parsed =
                    JSON.parse(
                        reader.result
                    );


                let restoredData;


                if (
                    parsed &&
                    parsed.data &&
                    typeof parsed.data === 'object'
                ) {

                    restoredData =
                        parsed.data;

                } else {

                    restoredData =
                        parsed;

                }


                if (
                    !restoredData ||
                    typeof restoredData !== 'object' ||
                    Array.isArray(restoredData)
                ) {

                    throw new Error(
                        '형식 오류'
                    );

                }


                if (
                    !confirm(
                        '현재 전화번호부를 백업 파일 내용으로 바꾸시겠습니까?'
                    )
                ) {

                    event.target.value =
                        '';

                    return;
                }


                groupData =
                    restoredData;


                saveData();

                loadGroupList();


                alert(
                    '전화번호부가 복원되었습니다.'
                );


            } catch (error) {

                alert(
                    '올바른 전화번호부 백업 파일이 아닙니다.'
                );

            }


            event.target.value =
                '';

        };


    reader.readAsText(
        file
    );

}


/* =========================
   특수문자 보호
========================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

}


/* =========================
   시작
========================= */

loadGroupList();

</script>
