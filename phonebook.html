<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>모임별 회원 전화번호부</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 8px;
    color: #334155;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.05);
}

.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   메인 제목
========================= */

.main-header {
    text-align: center;
    padding: 12px 0 16px;
}

.main-title {
    margin: 0;
    font-size: 24px;
    color: #243447;
}


/* =========================
   모임 카드
========================= */

.group-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.025);
}

.group-main {
    display: flex;
    align-items: center;
    width: 100%;
}

.group-open {
    flex: 1;

    display: flex;
    align-items: center;

    border: none;
    background: transparent;

    padding: 17px 10px 17px 14px;

    text-align: left;
    cursor: pointer;
    font-family: inherit;

    min-width: 0;
}

.group-open:active {
    background: #f8fafc;
}

.group-info {
    min-width: 0;
    flex: 1;
}

.group-name {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #2563eb;
    font-size: 17px;
    font-weight: 700;
}


/* =========================
   작은 색상 사람 아이콘
========================= */

.group-icon {
    width: 25px;
    height: 25px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 12px;
    line-height: 1;

    flex-shrink: 0;
}

/* 파랑 */
.icon-1 {
    background: #e6f0ff;
}

/* 보라 */
.icon-2 {
    background: #f0e9ff;
}

/* 초록 */
.icon-3 {
    background: #e6f7ee;
}

/* 분홍 */
.icon-4 {
    background: #ffeaf2;
}

/* 주황 */
.icon-5 {
    background: #fff1df;
}


.group-desc {
    margin-top: 6px;
    margin-left: 33px;

    color: #718096;
    font-size: 13px;
}


/* =========================
   점 3개 관리 메뉴
========================= */

.menu-btn {
    width: 40px;
    height: 40px;

    margin-right: 8px;

    border: none;
    border-radius: 50%;

    background: transparent;

    font-size: 22px;
    color: #64748b;

    cursor: pointer;

    flex-shrink: 0;
}

.menu-btn:active {
    background: #eef2f7;
}

.group-menu {
    display: none;

    position: absolute;

    right: 10px;
    top: 58px;

    width: 165px;

    background: #ffffff;

    border: 1px solid #dce3ea;
    border-radius: 11px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.15);

    z-index: 100;

    overflow: hidden;
}

.group-menu.show {
    display: block;
}

.group-menu button {
    display: block;

    width: 100%;

    padding: 12px 14px;

    border: none;
    border-bottom: 1px solid #edf0f3;

    background: #ffffff;

    text-align: left;

    font-size: 13px;

    cursor: pointer;
}

.group-menu button:last-child {
    border-bottom: none;
}

.group-menu button:active {
    background: #f1f5f9;
}

.group-menu .delete-menu {
    color: #dc2626;
}


/* =========================
   순서 변경
========================= */

.reorder-panel {
    display: none;
    align-items: center;
    gap: 5px;
    padding-right: 9px;
}

.reorder-mode .menu-btn {
    display: none;
}

.reorder-mode .reorder-panel {
    display: flex;
}

.move-btn {
    width: 35px;
    height: 35px;

    border: 1px solid #d8dee7;
    border-radius: 8px;

    background: #f8fafc;
    color: #475569;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.move-btn:active {
    background: #e2e8f0;
}

.move-btn:disabled {
    opacity: 0.25;
    cursor: default;
}

.reorder-help {
    display: none;

    text-align: center;

    margin-bottom: 12px;
    padding: 9px;

    background: #f5f3ff;

    border-radius: 9px;

    color: #6d28d9;

    font-size: 12px;
}

.reorder-help.show {
    display: block;
}


/* =========================
   하단 버튼
========================= */

.bottom-tools {
    margin-top: 18px;
}

.add-group-btn {
    width: 100%;

    padding: 14px;

    border: none;
    border-radius: 11px;

    background: #7c3aed;
    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.add-group-btn:active {
    background: #6d28d9;
}

.reorder-btn {
    width: 100%;

    margin-top: 10px;
    padding: 12px;

    border: 1px solid #d7dee8;
    border-radius: 10px;

    background: #f8fafc;
    color: #475569;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.reorder-btn.active {
    background: #16a34a;
    border-color: #16a34a;
    color: #ffffff;
}

.backup-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.backup-btn {
    flex: 1;

    padding: 11px;

    border: 1px solid #d7dee8;
    border-radius: 9px;

    background: #f8fafc;
    color: #475569;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
}


/* =========================
   상세 화면
========================= */

.detail-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    border: none;
    border-radius: 8px;

    padding: 9px 13px;

    background: #64748b;
    color: #ffffff;

    font-size: 13px;

    cursor: pointer;
}

.save-text {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
}

.detail-title {
    margin: 22px 0 18px;

    text-align: center;

    color: #243447;
    font-size: 21px;
}


/* =========================
   검색
========================= */

.search-box {
    position: relative;
    margin-bottom: 10px;
}

.search-input {
    width: 100%;

    padding: 12px 42px 12px 40px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #f8fafc;

    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #2563eb;
    background: #ffffff;
}

.search-icon {
    position: absolute;

    left: 13px;
    top: 50%;

    transform: translateY(-50%);
}

.clear-search {
    display: none;

    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 27px;
    height: 27px;

    border: none;
    border-radius: 50%;

    background: #e2e8f0;
    color: #475569;

    cursor: pointer;
}

.search-result {
    margin: 0 0 10px 3px;

    color: #64748b;
    font-size: 12px;
}


/* =========================
   회원 카드
========================= */

.member-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.member-card {
    padding: 11px;

    border: 1px solid #dbe2ea;
    border-radius: 12px;

    background: #ffffff;

    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.member-top {
    display: grid;

    grid-template-columns: 1fr 1.5fr;

    gap: 7px;
}

.member-card input {
    width: 100%;

    padding: 10px;

    border: 1px solid #d7dee8;
    border-radius: 7px;

    font-size: 14px;
    outline: none;
}

.member-card input:focus {
    border-color: #2563eb;
    background: #f8fbff;
}

.memo-input {
    margin-top: 7px;
}

.member-actions {
    display: flex;
    gap: 6px;

    margin-top: 9px;
}

.action-btn {
    flex: 1;

    border: none;
    border-radius: 7px;

    padding: 10px 4px;

    color: #ffffff;

    font-size: 13px;

    cursor: pointer;
}

.call-btn {
    background: #2563eb;
}

.sms-btn {
    background: #0891b2;
}

.delete-btn {
    background: #dc2626;
}

.add-member-btn {
    width: 100%;

    margin-top: 13px;
    padding: 13px;

    border: none;
    border-radius: 9px;

    background: #16a34a;
    color: #ffffff;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.empty-message {
    padding: 25px 10px;

    text-align: center;

    color: #94a3b8;

    font-size: 14px;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 12px;
    }

    .main-title {
        font-size: 22px;
    }

    .group-name {
        font-size: 17px;
    }

    .group-icon {
        width: 24px;
        height: 24px;
        font-size: 11px;
    }

    .group-desc {
        margin-left: 32px;
    }

    .member-top {
        grid-template-columns: 1fr;
    }

    .action-btn {
        font-size: 12px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- =========================
         메인 화면
    ========================== -->

    <div id="page-main" class="page active">

        <div class="main-header">

            <h1 class="main-title">
                📚 모임별 전화번호부
            </h1>

        </div>


        <div
            id="reorder-help"
            class="reorder-help"
        >
            ▲ ▼ 버튼을 눌러 원하는 순서로 이동하세요.
        </div>


        <div id="group-list"></div>


        <div class="bottom-tools">

            <button
                type="button"
                class="add-group-btn"
                onclick="addGroup()"
            >
                ＋ 새로운 모임 추가
            </button>


            <button
                type="button"
                id="reorder-btn"
                class="reorder-btn"
                onclick="toggleReorderMode()"
            >
                ↕ 모임 순서 변경
            </button>


            <div class="backup-row">

                <button
                    type="button"
                    class="backup-btn"
                    onclick="backupData()"
                >
                    📥 백업하기
                </button>

                <button
                    type="button"
                    class="backup-btn"
                    onclick="document.getElementById('restore-file').click()"
                >
                    📤 복원하기
                </button>

            </div>


            <input
                type="file"
                id="restore-file"
                accept=".json,application/json"
                style="display:none"
                onchange="restoreData(event)"
            >

        </div>

    </div>



    <!-- =========================
         회원 상세 화면
    ========================== -->

    <div id="page-detail" class="page">

        <div class="detail-top">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >
                ← 모임 목록
            </button>

            <span class="save-text">
                ✓ 자동 저장
            </span>

        </div>


        <h1
            id="group-title"
            class="detail-title"
        >
            회원 명단
        </h1>


        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="이름, 전화번호, 메모 검색"
                oninput="searchMembers()"
            >

            <button
                type="button"
                id="clear-search"
                class="clear-search"
                onclick="clearSearch()"
            >
                ×
            </button>

        </div>


        <div
            id="search-result"
            class="search-result"
        ></div>


        <div
            id="member-list"
            class="member-list"
        ></div>


        <button
            type="button"
            class="add-member-btn"
            onclick="addMember()"
        >
            ＋ 회원 추가
        </button>

    </div>

</div>



<script>

/* =========================
   저장 설정
========================= */

const STORAGE_KEY =
    'phoneBookDataV3';


const defaultData = {

        desc: '매월 첫주 도서 토론',
        members: [
            {
                name: '김철수',
                phone: '010-1234-5678',
                memo: '
