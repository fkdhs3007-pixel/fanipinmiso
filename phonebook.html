<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>모임별 회원 전화번호부</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 10px;
    color: #333;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    color: #2c3e50;
    font-size: 22px;
    margin: 10px 0 20px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   모임 목록
========================= */

.group-card {
    background: white;
    border: 1px solid #d7dee8;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.group-open {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: white;
    border: none;
    padding: 15px;

    cursor: pointer;
    text-align: left;
    font-family: inherit;
}

.group-open:active {
    background: #f1f5f9;
}

.group-info {
    display: flex;
    flex-direction: column;
}

.group-name {
    font-size: 17px;
    font-weight: bold;
    color: #2563eb;
}

.group-desc {
    color: #64748b;
    font-size: 13px;
    margin-top: 4px;
}

.group-action {
    color: #2563eb;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
}


/* =========================
   모임 관리 버튼
========================= */

.group-manage {
    display: flex;
    border-top: 1px solid #e2e8f0;
}

.group-manage button {
    flex: 1;
    border: none;
    padding: 10px 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
}

.rename-group-btn {
    background: #f8fafc;
    color: #2563eb;
    border-right: 1px solid #e2e8f0 !important;
}

.desc-group-btn {
    background: #f8fafc;
    color: #7c3aed;
    border-right: 1px solid #e2e8f0 !important;
}

.delete-group-btn {
    background: #fff7f7;
    color: #dc2626;
}


/* =========================
   새 모임 추가
========================= */

.add-group-btn {
    width: 100%;
    border: none;
    background: #7c3aed;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.add-group-btn:active {
    background: #6d28d9;
}


/* =========================
   상세 화면
========================= */

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: #64748b;
    color: white;
    border: none;
    padding: 8px 13px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
}

.save-text {
    color: #16a34a;
    font-size: 12px;
    font-weight: 600;
}


/* =========================
   검색창
========================= */

.search-box {
    position: relative;
    margin-bottom: 12px;
}

.search-input {
    width: 100%;
    padding: 12px 42px 12px 40px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    background: #f8fafc;
}

.search-input:focus {
    border-color: #2563eb;
    background: white;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
}

.clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);

    border: none;
    background: #e2e8f0;
    color: #475569;

    width: 26px;
    height: 26px;

    border-radius: 50%;
    cursor: pointer;
    display: none;
}

.search-result {
    font-size: 12px;
    color: #64748b;
    margin: -3px 0 10px 3px;
}


/* =========================
   회원 카드
========================= */

.member-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.member-card {
    border: 1px solid #dbe2ea;
    border-radius: 11px;
    padding: 11px;
    background: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.member-top {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 7px;
}

.member-card input {
    width: 100%;
    border: 1px solid #d7dee8;
    padding: 9px;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.member-card input:focus {
    border-color: #2563eb;
    background: #f8fbff;
}

.memo-input {
    margin-top: 7px;
}


/* =========================
   회원 관리 버튼
========================= */

.member-actions {
    margin-top: 9px;
    display: flex;
    gap: 6px;
}

.action-btn {
    flex: 1;
    border: none;
    padding: 9px 4px;
    border-radius: 7px;
    color: white;
    font-size: 13px;
    cursor: pointer;
}

.call-btn {
    background: #2563eb;
}

.sms-btn {
    background: #0891b2;
}

.delete-btn {
    background: #dc2626;
}


/* =========================
   회원 추가
========================= */

.add-member-btn {
    width: 100%;
    margin-top: 13px;
    border: none;
    background: #16a34a;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.empty-message {
    text-align: center;
    padding: 25px 10px;
    color: #94a3b8;
    font-size: 14px;
}


/* =========================
   휴대폰
========================= */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 20px;
    }

    .member-top {
        grid-template-columns: 1fr;
    }

    .group-manage button {
        font-size: 11px;
        padding: 10px 2px;
    }

    .action-btn {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">


    <!-- 메인 화면 -->
    <div id="page-main" class="page active">

        <h1>📚 모임별 전화번호부</h1>

        <p style="
            text-align:center;
            color:#64748b;
            font-size:14px;
            margin-bottom:20px;
        ">
            확인하고 싶은 모임을 누르세요.
        </p>

        <div id="group-list"></div>

        <button
            type="button"
            class="add-group-btn"
            onclick="addGroup()"
        >
            ＋ 새로운 모임 추가
        </button>

    </div>


    <!-- 회원 상세 화면 -->
    <div id="page-detail" class="page">

        <div class="top-row">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >
                ⬅ 모임 목록
            </button>

            <span class="save-text">
                ✓ 자동 저장
            </span>

        </div>

        <h1 id="group-title">
            회원 명단
        </h1>


        <!-- 검색 -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="이름, 전화번호, 메모 검색"
                oninput="searchMembers()"
            >

            <button
                type="button"
                id="clear-search"
                class="clear-search"
                onclick="clearSearch()"
            >
                ×
            </button>

        </div>

        <div
            id="search-result"
            class="search-result"
        ></div>


        <div
            id="member-list"
            class="member-list"
        ></div>


        <button
            type="button"
            class="add-member-btn"
            onclick="addMember()"
        >
            ＋ 회원 추가
        </button>

    </div>

</div>


<script>

/* =========================
   기본 데이터
========================= */

const defaultData = {

    '독서모임': {

        icon: '📖',

        desc: '매월 첫주 도서 토론',

        members: [
            {
                name: '김철수',
                phone: '010-1234-5678',
                memo: '총무'
            },
            {
                name: '이영희',
                phone: '010-9876-5432',
                memo: '회원'
            }
        ]

    },

    '동창회': {

        icon: '🎓',

        desc: '연 2회 정기 모임',

        members: [
            {
                name: '박민수',
                phone: '010-5555-4444',
                memo: '회장'
            }
        ]

    },

    '등산모임': {

        icon: '⛰️',

        desc: '주말 산행 및 건강 관리',

        members: []

    }

};


/* =========================
   데이터 불러오기
========================= */

let savedData =
    localStorage.getItem(
        'phoneBookDataV2'
    );

let groupData;

try {

    groupData =
        savedData
        ? JSON.parse(savedData)
        : defaultData;

} catch (error) {

    groupData =
        defaultData;

}

let currentGroup = '';
let currentSearch = '';


/* =========================
   자동 저장
========================= */

function saveData() {

    localStorage.setItem(
        'phoneBookDataV2',
        JSON.stringify(groupData)
    );

}


/* =========================
   모임 목록
========================= */

function loadGroupList() {

    const list =
        document.getElementById(
            'group-list'
        );

    list.innerHTML = '';


    Object.keys(groupData).forEach(
        groupName => {

            const group =
                groupData[groupName];


            const memberCount =
                group.members
                ? group.members.length
                : 0;


            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'group-card';


            /* 모임 열기 */

            const openButton =
                document.createElement(
                    'button'
                );

            openButton.type =
                'button';

            openButton.className =
                'group-open';


            openButton.innerHTML = `

                <div class="group-info">

                    <div class="group-name">

                        ${escapeHtml(
                            group.icon || '👥'
                        )}

                        ${escapeHtml(
                            groupName
                        )}

                    </div>

                    <div class="group-desc">

                        ${escapeHtml(
                            group.desc || '회원 모임'
                        )}

                        · 회원 ${memberCount}명

                    </div>

                </div>

                <div class="group-action">
                    열기 ➡
                </div>

            `;


            openButton.onclick =
                function () {

                    openGroup(
                        groupName
                    );

                };


            /* 관리 영역 */

            const manage =
                document.createElement(
                    'div'
                );

            manage.className =
                'group-manage';


            /* 이름 변경 */

            const renameButton =
                document.createElement(
                    'button'
                );

            renameButton.type =
                'button';

            renameButton.className =
                'rename-group-btn';

            renameButton.innerHTML =
                '✏️ 이름 변경';

            renameButton.onclick =
                function () {

                    renameGroup(
                        groupName
                    );

                };


            /* 설명 변경 */

            const descButton =
                document.createElement(
                    'button'
                );

            descButton.type =
                'button';

            descButton.className =
                'desc-group-btn';

            descButton.innerHTML =
                '📝 설명 변경';

            descButton.onclick =
                function () {

                    editGroupDescription(
                        groupName
                    );

                };


            /* 모임 삭제 */

            const deleteButton =
                document.createElement(
                    'button'
                );

            deleteButton.type =
                'button';

            deleteButton.className =
                'delete-group-btn';

            deleteButton.innerHTML =
                '🗑 모임 삭제';

            deleteButton.onclick =
                function () {

                    deleteGroup(
                        groupName
                    );

                };


            manage.appendChild(
                renameButton
            );

            manage.appendChild(
                descButton
            );

            manage.appendChild(
                deleteButton
            );


            card.appendChild(
                openButton
            );

            card.appendChild(
                manage
            );


            list.appendChild(
                card
            );

        }
    );

}
