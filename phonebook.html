<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>모임별 회원 전화번호부</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 10px;
    color: #333;
}

.container {
    max-width: 800px;
    margin: auto;
    background: #ffffff;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    color: #2c3e50;
    font-size: 22px;
    margin: 15px 0 25px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* =========================
   모임 카드
========================= */

.group-card {
    background: #ffffff;
    border: 1px solid #d7dee8;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.group-open {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px;

    background: #ffffff;
    border: none;

    text-align: left;
    font-family: inherit;
    cursor: pointer;
}

.group-open:active {
    background: #f1f5f9;
}

.group-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.group-name {
    font-size: 18px;
    font-weight: bold;
    color: #2563eb;
}

.group-desc {
    margin-top: 6px;
    color: #64748b;
    font-size: 13px;
}

.group-action {
    color: #2563eb;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
}


/* =========================
   모임 관리
========================= */

.group-manage {
    display: flex;
    border-top: 1px solid #e2e8f0;
}

.group-manage button {
    flex: 1;
    border: none;
    padding: 11px 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
}

.rename-group-btn {
    background: #f8fafc;
    color: #2563eb;
    border-right: 1px solid #e2e8f0 !important;
}

.desc-group-btn {
    background: #faf8ff;
    color: #7c3aed;
    border-right: 1px solid #e2e8f0 !important;
}

.delete-group-btn {
    background: #fff7f7;
    color: #dc2626;
}


/* =========================
   새 모임 추가
========================= */

.add-group-btn {
    width: 100%;
    margin-top: 5px;
    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #7c3aed;
    color: #ffffff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.add-group-btn:active {
    background: #6d28d9;
}


/* =========================
   상세 화면
========================= */

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    border: none;
    border-radius: 7px;

    padding: 9px 13px;

    background: #64748b;
    color: white;

    font-size: 13px;
    cursor: pointer;
}

.save-text {
    color: #16a34a;
    font-size: 12px;
    font-weight: bold;
}


/* =========================
   검색창
========================= */

.search-box {
    position: relative;
    margin-bottom: 12px;
}

.search-input {
    width: 100%;

    padding: 12px 42px 12px 40px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #f8fafc;

    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #2563eb;
    background: #ffffff;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
}

.clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);

    width: 27px;
    height: 27px;

    border: none;
    border-radius: 50%;

    background: #e2e8f0;
    color: #475569;

    cursor: pointer;
    display: none;
}

.search-result {
    margin: -3px 0 10px 3px;

    color: #64748b;
    font-size: 12px;
}


/* =========================
   회원 카드
========================= */

.member-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.member-card {
    padding: 11px;

    border: 1px solid #dbe2ea;
    border-radius: 11px;

    background: #ffffff;

    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.member-top {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 7px;
}

.member-card input {
    width: 100%;

    padding: 10px;

    border: 1px solid #d7dee8;
    border-radius: 7px;

    font-size: 14px;
    outline: none;
}

.member-card input:focus {
    border-color: #2563eb;
    background: #f8fbff;
}

.memo-input {
    margin-top: 7px;
}


/* =========================
   전화 문자 삭제
========================= */

.member-actions {
    display: flex;
    gap: 6px;
    margin-top: 9px;
}

.action-btn {
    flex: 1;

    border: none;
    border-radius: 7px;

    padding: 10px 4px;

    color: white;
    font-size: 13px;

    cursor: pointer;
}

.call-btn {
    background: #2563eb;
}

.sms-btn {
    background: #0891b2;
}

.delete-btn {
    background: #dc2626;
}


/* =========================
   회원 추가
========================= */

.add-member-btn {
    width: 100%;

    margin-top: 13px;
    padding: 13px;

    border: none;
    border-radius: 8px;

    background: #16a34a;
    color: #ffffff;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.empty-message {
    padding: 25px 10px;

    color: #94a3b8;
    font-size: 14px;

    text-align: center;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 20px;
    }

    .member-top {
        grid-template-columns: 1fr;
    }

    .group-manage button {
        font-size: 11px;
        padding: 10px 2px;
    }

    .action-btn {
        font-size: 12px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- 메인 화면 -->

    <div id="page-main" class="page active">

        <h1>📚 모임별 전화번호부</h1>

        <p style="
            text-align:center;
            color:#64748b;
            font-size:14px;
            margin-bottom:20px;
        ">
            확인하고 싶은 모임을 누르세요.
        </p>

        <div id="group-list"></div>


        <button
            type="button"
            class="add-group-btn"
            onclick="addGroup()"
        >
            ＋ 새로운 모임 추가
        </button>

    </div>



    <!-- 회원 상세 -->

    <div id="page-detail" class="page">

        <div class="top-row">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >
                ⬅ 모임 목록
            </button>

            <span class="save-text">
                ✓ 자동 저장
            </span>

        </div>


        <h1 id="group-title">
            회원 명단
        </h1>


        <!-- 검색 -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="이름, 전화번호, 메모 검색"
                oninput="searchMembers()"
            >

            <button
                type="button"
                id="clear-search"
                class="clear-search"
                onclick="clearSearch()"
            >
                ×
            </button>

        </div>


        <div
            id="search-result"
            class="search-result"
        ></div>


        <div
            id="member-list"
            class="member-list"
        ></div>


        <button
            type="button"
            class="add-member-btn"
            onclick="addMember()"
        >
            ＋ 회원 추가
        </button>

    </div>

</div>



<script>

/* =========================
   기본 모임
========================= */

const defaultData = {

    '독서모임': {

        icon: '📖',

        desc: '매월 첫주 도서 토론',

        members: [
            {
                name: '김철수',
                phone: '010-1234-5678',
                memo: '총무'
            },
            {
                name: '이영희',
                phone: '010-9876-5432',
                memo: '회원'
            }
        ]

    },


    '동창회': {

        icon: '🎓',

        desc: '연 2회 정기 모임',

        members: [
            {
                name: '박민수',
                phone: '010-5555-4444',
                memo: '회장'
            }
        ]

    },


    '등산모임': {

        icon: '⛰️',

        desc: '주말 산행 및 건강 관리',

        members: []

    }

};


/* =========================
   저장 키
========================= */

const STORAGE_KEY =
    'phoneBookDataV3';

const OLD_STORAGE_KEY =
    'phoneBookDataV2';


/* =========================
   복사
========================= */

function copyData(data) {

    return JSON.parse(
        JSON.stringify(data)
    );

}


/* =========================
   데이터 불러오기
========================= */

function loadSavedData() {

    /* 새로운 V3 데이터가 있으면 사용 */

    const newSaved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (newSaved !== null) {

        try {

            const parsed =
                JSON.parse(newSaved);

            if (
                parsed &&
                typeof parsed === 'object' &&
                !Array.isArray(parsed)
            ) {

                return parsed;

            }

        } catch (error) {

            console.log(
                'V3 저장 데이터 오류'
            );

        }

    }


    /* 기존 V2 데이터 확인 */

    const oldSaved =
        localStorage.getItem(
            OLD_STORAGE_KEY
        );


    if (oldSaved !== null) {

        try {

            const oldParsed =
                JSON.parse(oldSaved);


            /* 기존 데이터에 모임이 있을 때만 가져오기 */

            if (
                oldParsed &&
                typeof oldParsed === 'object' &&
                !Array.isArray(oldParsed) &&
                Object.keys(oldParsed).length > 0
            ) {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        oldParsed
                    )
                );

                return oldParsed;

            }

        } catch (error) {

            console.log(
                'V2 저장 데이터 오류'
            );

        }

    }


    /* 저장된 정상 데이터가 없으면 기본값 */

    const freshData =
        copyData(defaultData);


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            freshData
        )
    );


    return freshData;

}


/* =========================
   변수
========================= */

let groupData =
    loadSavedData();

let currentGroup =
    '';

let currentSearch =
    '';


/* =========================
   저장
========================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(groupData)
    );

}


/* =========================
   모임 목록
========================= */

function loadGroupList() {

    const list =
        document.getElementById(
            'group-list'
        );


    list.innerHTML =
        '';


    const groupNames =
        Object.keys(groupData);


    if (
        groupNames.length === 0
    ) {

        list.innerHTML = `
            <div class="empty-message">
                등록된 모임이 없습니다.<br><br>
                아래의 ＋ 새로운 모임 추가를 눌러주세요.
            </div>
        `;

        return;

    }


    groupNames.forEach(
        groupName => {


            const group =
                groupData[groupName];


            if (!group.members) {

                group.members = [];

            }


            const memberCount =
                group.members.length;


            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'group-card';



            /* 모임 열기 */

            const openButton =
                document.createElement(
                    'button'
                );


            openButton.type =
                'button';


            openButton.className =
                'group-open';


            openButton.innerHTML = `

                <div class="group-info">

                    <div class="group-name">

                        ${escapeHtml(
                            group.icon || '👥'
                        )}

                        ${escapeHtml(
                            groupName
                        )}

                    </div>

                    <div class="group-desc">

                        ${escapeHtml(
                            group.desc || '회원 모임'
                        )}

                        · 회원 ${memberCount}명

                    </div>

                </div>


                <div class="group-action">
                    열기 ➡
                </div>

            `;


            openButton.onclick =
                function () {

                    openGroup(
                        groupName
                    );

                };



            /* 관리 버튼 */

            const manage =
                document.createElement(
                    'div'
                );


            manage.className =
                'group-manage';



            /* 이름 변경 */

            const renameButton =
                document.createElement(
                    'button'
                );


            renameButton.type =
                'button';


            renameButton.className =
                'rename-group-btn';


            renameButton.innerHTML =
                '✏️ 이름 변경';


            renameButton.onclick =
                function () {

                    renameGroup(
                        groupName
                    );

                };



            /* 설명 변경 */

            const descButton =
                document.createElement(
                    'button'
                );


            descButton.type =
                'button';


            descButton.className =
                'desc-group-btn';


            descButton.innerHTML =
                '📝 설명 변경';


            descButton.onclick =
                function () {

                    editGroupDescription(
                        groupName
                    );

                };



            /* 모임 삭제 */

            const deleteButton =
                document.createElement(
                    'button'
                );


            deleteButton.type =
                'button';


            deleteButton.className =
                'delete-group-btn';


            deleteButton.innerHTML =
                '🗑 모임 삭제';


            deleteButton.onclick =
                function () {

                    deleteGroup(
                        groupName
                    );

                };



            manage.appendChild(
                renameButton
            );


            manage.appendChild(
                descButton
            );


            manage.appendChild(
                deleteButton
            );


            card.appendChild(
                openButton
            );


            card.appendChild(
                manage
            );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================
   모임 열기
========================= */

function openGroup(groupName) {

    if (!groupData[groupName]) {
        return;
    }


    currentGroup =
        groupName;


    currentSearch =
        '';


    document.getElementById(
        'search-input'
    ).value =
        '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    document.getElementById(
        'group-title'
    ).innerText =
        groupName +
        ' 회원 명단';


    document.getElementById(
        'page-main'
    ).classList.remove(
        'active'
    );


    document.getElementById(
        'page-detail'
    ).classList.add(
        'active'
    );


    loadMembers();


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


/* =========================
   목록으로
========================= */

function goBack() {

    document.getElementById(
        'page-detail'
    ).classList.remove(
        'active'
    );


    document.getElementById(
        'page-main'
    ).classList.add(
        'active'
    );


    currentGroup =
        '';


    currentSearch =
        '';


    loadGroupList();


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


/* =========================
   모임 이름 변경
========================= */

function renameGroup(oldName) {

    const newName =
        prompt(
            '새로운 모임 이름을 입력해주세요.',
            oldName
        );


    if (
        newName === null
    ) {
        return;
    }


    const cleanName =
        newName.trim();


    if (!cleanName) {

        alert(
            '모임 이름을 입력해주세요.'
        );

        return;

    }


    if (
        cleanName === oldName
    ) {
        return;
    }


    if (
        groupData[cleanName]
    ) {

        alert(
            '이미 같은 이름의 모임이 있습니다.'
        );

        return;

    }


    const newData = {};


    Object.keys(groupData).forEach(
        name => {

            if (
                name === oldName
            ) {

                newData[cleanName] =
                    groupData[oldName];

            } else {

                newData[name] =
                    groupData[name];

            }

        }
    );


    groupData =
        newData;


    saveData();

    loadGroupList();


    alert(
        '모임 이름이 변경되었습니다.'
    );

}


/* =========================
   모임 설명 변경
========================= */

function editGroupDescription(
    groupName
) {

    const currentDescription =
        groupData[groupName]
            .desc || '';


    const newDescription =
        prompt(
            '모임 설명을 입력해주세요.',
            currentDescription
        );


    if (
        newDescription === null
    ) {
        return;
    }


    const cleanDescription =
        newDescription.trim();


    groupData[groupName].desc =
        cleanDescription ||
        '회원 모임';


    saveData();

    loadGroupList();

}


/* =========================
   모임 삭제
========================= */

function deleteGroup(
    groupName
) {

    const group =
        groupData[groupName];


    if (!group) {
        return;
    }


    const memberCount =
        group.members
        ? group.members.length
        : 0;


    const firstConfirm =
        confirm(
            groupName +
            ' 모임과 등록된 회원 ' +
            memberCount +
            '명의 정보를 삭제하시겠습니까?'
        );


    if (!firstConfirm) {
        return;
    }


    const secondConfirm =
        confirm(
            '삭제하면 이 휴대폰에서 저장된 해당 모임 정보가 사라집니다.\n정말 삭제하시겠습니까?'
        );


    if (!secondConfirm) {
        return;
    }


    delete groupData[groupName];


    saveData();

    loadGroupList();

}


/* =========================
   회원 목록
========================= */

function loadMembers() {

    const list =
        document.getElementById(
            'member-list'
        );


    const resultText =
        document.getElementById(
            'search-result'
        );


    list.innerHTML =
        '';


    if (
        !currentGroup ||
        !groupData[currentGroup]
    ) {
        return;
    }


    if (
        !Array.isArray(
            groupData[currentGroup]
                .members
        )
    ) {

        groupData[currentGroup]
            .members = [];

    }


    const members =
        groupData[currentGroup]
            .members;


    const keyword =
        currentSearch
            .trim()
            .toLowerCase();


    const filteredMembers =
        [];


    members.forEach(
        (member, index) => {


            const searchableText =
                (
                    (member.name || '') +
                    ' ' +
                    (member.phone || '') +
                    ' ' +
                    (member.memo || '')
                ).toLowerCase();


            if (
                !keyword ||
                searchableText.includes(
                    keyword
                )
            ) {

                filteredMembers.push({

                    member:
                        member,

                    index:
                        index

                });

            }

        }
    );


    if (keyword) {

        resultText.innerText =
            '검색 결과 ' +
            filteredMembers.length +
            '명';

    } else {

        resultText.innerText =
            '전체 회원 ' +
            members.length +
            '명';

    }


    if (
        filteredMembers.length === 0
    ) {

        if (keyword) {

            list.innerHTML = `
                <div class="empty-message">
                    🔍 검색된 회원이 없습니다.
                </div>
            `;

        } else {

            list.innerHTML = `
                <div class="empty-message">
                    등록된 회원이 없습니다.<br><br>
                    아래의 ＋ 회원 추가를 눌러주세요.
                </div>
            `;

        }

        return;

    }


    filteredMembers.forEach(
        item => {


            const member =
                item.member;


            const index =
                item.index;


            const card =
                document.createElement(
                    'div'
                );


            card.className =
                'member-card';


            card.innerHTML = `

                <div class="member-top">

                    <input
                        type="text"
                        value="${escapeHtml(member.name || '')}"
                        placeholder="이름"
                        oninput="updateMember(${index}, 'name', this.value)"
                    >

                    <input
                        type="tel"
                        value="${escapeHtml(member.phone || '')}"
                        placeholder="010-0000-0000"
                        oninput="updateMember(${index}, 'phone', this.value)"
                    >

                </div>


                <input
                    class="memo-input"
                    type="text"
                    value="${escapeHtml(member.memo || '')}"
                    placeholder="메모"
                    oninput="updateMember(${index}, 'memo', this.value)"
                >


                <div class="member-actions">

                    <button
                        type="button"
                        class="action-btn call-btn"
                        onclick="callPhone(${index})"
                    >
                        📞 전화
                    </button>


                    <button
                        type="button"
                        class="action-btn sms-btn"
                        onclick="sendSMS(${index})"
                    >
                        💬 문자
                    </button>


                    <button
                        type="button"
                        class="action-btn delete-btn"
                        onclick="deleteMember(${index})"
                    >
                        🗑 삭제
                    </button>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* =========================
   검색
========================= */

function searchMembers() {

    const input =
        document.getElementById(
            'search-input'
        );


    currentSearch =
        input.value;


    document.getElementById(
        'clear-search'
    ).style.display =
        currentSearch.trim()
        ? 'block'
        : 'none';


    loadMembers();

}


/* =========================
   검색 초기화
========================= */

function clearSearch() {

    const input =
        document.getElementById(
            'search-input'
        );


    input.value =
        '';


    currentSearch =
        '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    loadMembers();

    input.focus();

}


/* =========================
   회원 수정
========================= */

function updateMember(
    index,
    field,
    value
) {

    if (
        !currentGroup ||
        !groupData[currentGroup] ||
        !groupData[currentGroup]
            .members[index]
    ) {
        return;
    }


    groupData[currentGroup]
        .members[index][field]
        =
        value;


    saveData();

}


/* =========================
   전화
========================= */

function callPhone(index) {

    const member =
        groupData[currentGroup]
            .members[index];


    const phone =
        member.phone || '';


    if (!phone) {

        alert(
            '전화번호를 먼저 입력해주세요.'
        );

        return;

    }


    const cleanPhone =
        phone.replace(
            /[^0-9+]/g,
            ''
        );


    window.location.href =
        'tel:' +
        cleanPhone;

}


/* =========================
   문자
========================= */

function sendSMS(index) {

    const member =
        groupData[currentGroup]
            .members[index];


    const phone =
        member.phone || '';


    if (!phone) {

        alert(
            '전화번호를 먼저 입력해주세요.'
        );

        return;

    }


    const cleanPhone =
        phone.replace(
            /[^0-9+]/g,
            ''
        );


    window.location.href =
        'sms:' +
        cleanPhone;

}


/* =========================
   회원 추가
========================= */

function addMember() {

    if (
        !currentGroup ||
        !groupData[currentGroup]
    ) {
        return;
    }


    groupData[currentGroup]
        .members
        .push({

            name: '',
            phone: '',
            memo: ''

        });


    saveData();


    currentSearch =
        '';


    document.getElementById(
        'search-input'
    ).value =
        '';


    document.getElementById(
        'clear-search'
    ).style.display =
        'none';


    loadMembers();


    setTimeout(
        function () {

            const cards =
                document.querySelectorAll(
                    '.member-card'
                );


            if (
                cards.length === 0
            ) {
                return;
            }


            const lastCard =
                cards[
                    cards.length - 1
                ];


            const firstInput =
                lastCard.querySelector(
                    'input'
                );


            if (firstInput) {

                firstInput.focus();

            }


            lastCard.scrollIntoView({

                behavior:
                    'smooth',

                block:
                    'center'

            });

        },

        50
    );

}


/* =========================
   회원 삭제
========================= */

function deleteMember(index) {

    const member =
        groupData[currentGroup]
            .members[index];


    if (!member) {
        return;
    }


    let message =
        '이 회원을 삭제하시겠습니까?';


    if (member.name) {

        message =
            member.name +
            ' 회원을 삭제하시겠습니까?';

    }


    if (!confirm(message)) {
        return;
    }


    groupData[currentGroup]
        .members
        .splice(
            index,
            1
        );


    saveData();

    loadMembers();

}


/* =========================
   새 모임 추가
========================= */

function addGroup() {

    const groupName =
        prompt(
            '새로운 모임 이름을 입력해주세요.'
        );


    if (
        groupName === null
    ) {
        return;
    }


    const cleanName =
        groupName.trim();


    if (!cleanName) {

        alert(
            '모임 이름을 입력해주세요.'
        );

        return;

    }


    if (
        groupData[cleanName]
    ) {

        alert(
            '이미 같은 이름의 모임이 있습니다.'
        );

        return;

    }


    const description =
        prompt(
            '모임 설명을 입력해주세요.\n예: 매월 첫째 주 정기모임'
        );


    groupData[cleanName] = {

        icon:
            '👥',

        desc:
            description &&
            description.trim()
            ? description.trim()
            : '회원 모임',

        members:
            []

    };


    saveData();

    loadGroupList();

}


/* =========================
   특수문자 보호
========================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        );

}


/* =========================
   시작
========================= */

loadGroupList();

</script>

</body>
</html>
